<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>API HUB | فروشگاه API</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(circle at 20% 20%,rgba(0,140,255,.12),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(0,80,255,.10),transparent 30%),
        #050914;
    color:#fff;
    min-height:100vh;
}

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background:
        linear-gradient(rgba(255,255,255,.015) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.015) 1px,transparent 1px);
    background-size:50px 50px;
}

header{
    position:sticky;
    top:0;
    z-index:100;
    backdrop-filter:blur(20px);
    background:rgba(5,9,20,.75);
    border-bottom:1px solid rgba(255,255,255,.08);
}

.navbar{
    max-width:1250px;
    margin:auto;
    padding:18px 25px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:20px;
}

.logo{
    font-size:25px;
    font-weight:900;
    letter-spacing:1px;
    color:#fff;
}

.logo span{
    color:#149cff;
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:10px;
}

.btn{
    border:0;
    cursor:pointer;
    border-radius:12px;
    padding:12px 20px;
    color:white;
    font-weight:bold;
    transition:.25s;
}

.login-btn{
    background:linear-gradient(135deg,#087cff,#00b7ff);
    box-shadow:0 8px 25px rgba(0,145,255,.25);
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(0,145,255,.4);
}

.logout-btn{
    background:rgba(255,255,255,.08);
    border:1px solid rgba(255,255,255,.12);
}

.user-box{
    display:none;
    align-items:center;
    gap:10px;
}

.user-name{
    color:#7dcfff;
    font-weight:bold;
}

.hero{
    max-width:1250px;
    margin:0 auto;
    padding:90px 25px 50px;
    text-align:center;
}

.hero h1{
    font-size:clamp(38px,6vw,72px);
    font-weight:1000;
    line-height:1.1;
    margin-bottom:20px;
}

.hero h1 span{
    background:linear-gradient(90deg,#00aaff,#6d5cff,#00e5ff);
    -webkit-background-clip:text;
    color:transparent;
}

.hero p{
    color:#aab5c9;
    font-size:18px;
    max-width:700px;
    margin:auto;
    line-height:2;
}

.search-box{
    max-width:700px;
    margin:40px auto 0;
    position:relative;
}

.search-box input{
    width:100%;
    padding:18px 22px;
    border-radius:18px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.06);
    color:white;
    outline:none;
    font-size:16px;
    backdrop-filter:blur(15px);
}

.search-box input:focus{
    border-color:#008cff;
    box-shadow:0 0 30px rgba(0,140,255,.15);
}

.container{
    max-width:1250px;
    margin:auto;
    padding:30px 25px 80px;
}

.section-title{
    font-size:28px;
    margin-bottom:25px;
}

.products{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(270px,1fr));
    gap:22px;
}

.card{
    position:relative;
    overflow:hidden;
    padding:25px;
    min-height:270px;
    border-radius:22px;
    background:linear-gradient(
        145deg,
        rgba(255,255,255,.08),
        rgba(255,255,255,.025)
    );
    border:1px solid rgba(255,255,255,.09);
    box-shadow:0 20px 50px rgba(0,0,0,.25);
    transition:.3s;
}

.card::before{
    content:"";
    position:absolute;
    width:150px;
    height:150px;
    border-radius:50%;
    background:#008cff;
    filter:blur(80px);
    opacity:.12;
    top:-70px;
    right:-70px;
}

.card:hover{
    transform:translateY(-7px);
    border-color:rgba(0,160,255,.4);
    box-shadow:0 25px 70px rgba(0,90,255,.15);
}

.icon{
    width:60px;
    height:60px;
    display:flex;
    align-items:center;
    justify-content:center;
    border-radius:17px;
    background:rgba(0,140,255,.12);
    font-size:29px;
    margin-bottom:18px;
}

.card h3{
    font-size:21px;
    margin-bottom:12px;
}

.description{
    color:#9da9bd;
    line-height:1.8;
    min-height:58px;
    font-size:14px;
}

.card-bottom{
    margin-top:20px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:10px;
}

.price{
    color:#55c7ff;
    font-weight:bold;
    font-size:17px;
}

.buy-btn{
    border:0;
    cursor:pointer;
    color:white;
    padding:11px 16px;
    border-radius:11px;
    background:linear-gradient(135deg,#087cff,#00b7ff);
    font-weight:bold;
}

.loading,
.empty{
    text-align:center;
    color:#94a3b8;
    padding:50px;
    grid-column:1/-1;
}

footer{
    text-align:center;
    padding:35px;
    color:#68758b;
    border-top:1px solid rgba(255,255,255,.07);
}

/* MODAL */

.modal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:rgba(0,0,0,.7);
    backdrop-filter:blur(12px);
}

.modal.active{
    display:flex;
}

.modal-box{
    width:100%;
    max-width:430px;
    padding:30px;
    border-radius:25px;
    background:#0b1222;
    border:1px solid rgba(255,255,255,.1);
    box-shadow:0 30px 100px rgba(0,0,0,.55);
    position:relative;
}

.close{
    position:absolute;
    top:15px;
    left:18px;
    border:0;
    background:none;
    color:#aaa;
    font-size:27px;
    cursor:pointer;
}

.modal-title{
    text-align:center;
    font-size:27px;
    margin-bottom:25px;
}

.tabs{
    display:flex;
    gap:8px;
    margin-bottom:22px;
}

.tab{
    flex:1;
    padding:12px;
    border:0;
    border-radius:11px;
    cursor:pointer;
    background:rgba(255,255,255,.06);
    color:#aaa;
    font-weight:bold;
}

.tab.active{
    color:white;
    background:linear-gradient(135deg,#087cff,#00aaff);
}

.form{
    display:none;
}

.form.active{
    display:block;
}

.input{
    width:100%;
    padding:15px;
    margin-bottom:13px;
    border-radius:12px;
    border:1px solid rgba(255,255,255,.1);
    background:rgba(255,255,255,.05);
    color:white;
    outline:none;
}

.input:focus{
    border-color:#008cff;
}

.submit{
    width:100%;
    padding:15px;
    border:0;
    border-radius:12px;
    color:white;
    font-weight:bold;
    cursor:pointer;
    background:linear-gradient(135deg,#087cff,#00b7ff);
}

.message{
    margin-top:15px;
    text-align:center;
    font-size:14px;
    min-height:20px;
    color:#7dcfff;
}

@media(max-width:600px){
    .navbar{
        padding:15px;
    }

    .hero{
        padding-top:60px;
    }

    .hero h1{
        font-size:42px;
    }

    .user-name{
        display:none;
    }

    .container{
        padding-left:15px;
        padding-right:15px;
    }
}
</style>
</head>

<body>

<header>
    <div class="navbar">

        <div class="logo">
            API <span>HUB</span>
        </div>

        <div class="nav-actions">

            <div class="user-box" id="userBox">
                <span class="user-name" id="userName"></span>
                <button class="btn logout-btn" onclick="logout()">
                    خروج
        </div>      
            <button class="btn panel-btn" onclick="openPanel()">
    پنل کاربری
</button>    </button>
            

            <button
                class="btn login-btn"
                id="loginButton"
                onclick="openAuth()">
                ورود / ثبت‌نام
            </button>

        </div>
    </div>
</header>

<section class="hero">

    <h1>
        API های حرفه‌ای برای
        <span>پروژه‌های شما</span>
    </h1>

    <p>
        API HUB یک فروشگاه مدرن برای پیدا کردن و استفاده از
        APIهای قدرتمند، سریع و قابل اعتماد است.
    </p>

    <div class="search-box">
        <input
            id="searchInput"
            type="text"
            placeholder="جستجوی API..."
            oninput="filterProducts()">
    </div>

</section>

<main class="container">

    <h2 class="section-title">
        API های موجود
    </h2>

    <div class="products" id="productList">
        <div class="loading">
            در حال دریافت API ها...
        </div>
    </div>

</main>

<footer>
    © 2026 API HUB — تمامی حقوق محفوظ است.
</footer>


<!-- AUTH MODAL -->

<div class="modal" id="authModal">

    <div class="modal-box">

        <button class="close" onclick="closeAuth()">×</button>

        <h2 class="modal-title">
            حساب API HUB
        </h2>

        <div class="tabs">

            <button
                class="tab active"
                id="loginTab"
                onclick="showLogin()">
                ورود
            </button>

            <button
                class="tab"
                id="registerTab"
                onclick="showRegister()">
                ثبت‌نام
            </button>

        </div>


        <!-- LOGIN -->

        <form
            class="form active"
            id="loginForm"
            onsubmit="login(event)">

            <input
                class="input"
                id="loginEmail"
                type="email"
                placeholder="ایمیل"
                required>

            <input
                class="input"
                id="loginPassword"
                type="password"
                placeholder="رمز عبور"
                required>

            <button
                class="submit"
                type="submit">
                ورود به حساب
            </button>

        </form>


        <!-- REGISTER -->

        <form
            class="form"
            id="registerForm"
            onsubmit="register(event)">

            <input
                class="input"
                id="registerName"
                type="text"
                placeholder="نام"
                required>

            <input
                class="input"
                id="registerEmail"
                type="email"
                placeholder="ایمیل"
                required>

            <input
                class="input"
                id="registerPassword"
                type="password"
                placeholder="رمز عبور"
                minlength="6"
                required>

            <button
                class="submit"
                type="submit">
                ساخت حساب
            </button>

        </form>

        <div class="message" id="authMessage"></div>

    </div>
</div>


<script>

const API_BASE =
    "https://api-hub-backend.mirzaeiabolfazl908.workers.dev";

let allProducts = [];


/* =========================
   PRODUCTS
========================= */

async function loadProducts(){

    const list = document.getElementById("productList");

    try{

        const response =
            await fetch(API_BASE + "/api/products");

        if(!response.ok){
            throw new Error("خطا در دریافت API ها");
        }

        allProducts = await response.json();

        renderProducts(allProducts);

    }catch(error){

        console.error(error);

        list.innerHTML = `
            <div class="empty">
                دریافت API ها با مشکل مواجه شد.
                <br><br>
                لطفاً دوباره تلاش کنید.
            </div>
        `;
    }
}


function getIcon(name){

    const icons = {
        "AI Text API":"🤖",
        "Data API":"📊",
        "Utility API":"⚙️",
        "Vision API":"🧠",
        "Web Data API":"🌐",
        "Security API":"🔐"
    };

    return icons[name] || "🔌";
}


function formatPrice(price){

    return Number(price || 0).toLocaleString("fa-IR") + " تومان";
}


function renderProducts(products){

    const list =
        document.getElementById("productList");

    if(!products.length){

        list.innerHTML = `
            <div class="empty">
                API موردنظر پیدا نشد.
            </div>
        `;

        return;
    }

    list.innerHTML =
        products.map(product => `

            <div class="card">

                <div class="icon">
                    ${getIcon(product.name)}
                </div>

                <h3>
                    ${escapeHTML(product.name)}
                </h3>

                <div class="description">
                    ${escapeHTML(
                        product.description ||
                        "API قدرتمند و آماده استفاده برای پروژه‌های شما."
                    )}
                </div>

                <div class="card-bottom">

                    <span class="price">
                        ${formatPrice(product.price)}
                    </span>

<a
    class="buy-btn"
    href="api.html?id=${encodeURIComponent(product.id)}"
>
    مشاهده و خرید
</a>
                </div>

            </div>

        `).join("");
}


function filterProducts(){

    const value =
        document.getElementById("searchInput")
        .value
        .trim()
        .toLowerCase();

    if(!value){

        renderProducts(allProducts);
        return;
    }

    const filtered =
        allProducts.filter(product =>
            String(product.name)
            .toLowerCase()
            .includes(value)
        );

    renderProducts(filtered);
}


function openAPI(id){

    window.location.href =
        "api.html?id=" +
        encodeURIComponent(id);
}


function escapeHTML(value){

    return String(value)
        .replaceAll("&","&amp;")
        .replaceAll("<","&lt;")
        .replaceAll(">","&gt;")
        .replaceAll('"',"&quot;")
        .replaceAll("'","&#039;");
}


/* =========================
   AUTH MODAL
========================= */

function openAuth(){

    document
        .getElementById("authModal")
        .classList.add("active");

    showLogin();
}


function closeAuth(){

    document
        .getElementById("authModal")
        .classList.remove("active");

    document.getElementById("authMessage")
        .textContent = "";
}


function showLogin(){

    document
        .getElementById("loginForm")
        .classList.add("active");

    document
        .getElementById("registerForm")
        .classList.remove("active");

    document
        .getElementById("loginTab")
        .classList.add("active");

    document
        .getElementById("registerTab")
        .classList.remove("active");

    document
        .getElementById("authMessage")
        .textContent = "";
}


function showRegister(){

    document
        .getElementById("registerForm")
        .classList.add("active");

    document
        .getElementById("loginForm")
        .classList.remove("active");

    document
        .getElementById("registerTab")
        .classList.add("active");

    document
        .getElementById("loginTab")
        .classList.remove("active");

    document
        .getElementById("authMessage")
        .textContent = "";
}


function showMessage(text){

    document
        .getElementById("authMessage")
        .textContent = text;
}


/* =========================
   REGISTER
========================= */

async function register(event){

    event.preventDefault();

    const name =
        document.getElementById("registerName")
        .value
        .trim();

    const email =
        document.getElementById("registerEmail")
        .value
        .trim();

    const password =
        document.getElementById("registerPassword")
        .value;

    if(!name || !email || !password){

        showMessage("لطفاً همه فیلدها را کامل کنید.");
        return;
    }

    showMessage("در حال ساخت حساب...");

    try{

        const response =
            await fetch(
                API_BASE + "/api/register",
                {
                    method:"POST",
                    credentials:"include",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        name,
                        email,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok || data.success === false){

            showMessage(
                data.message ||
                "ثبت‌نام انجام نشد."
            );

            return;
        }

        showMessage(
            "حساب با موفقیت ساخته شد. حالا وارد شوید."
        );

        setTimeout(() => {

            showLogin();

            document.getElementById("loginEmail")
                .value = email;

        },800);

    }catch(error){

        console.error(error);

        showMessage(
            "ارتباط با سرور برقرار نشد."
        );
    }
}


/* =========================
   LOGIN
========================= */

async function login(event){

    event.preventDefault();

    const email =
        document.getElementById("loginEmail")
        .value
        .trim();

    const password =
        document.getElementById("loginPassword")
        .value;

    showMessage("در حال ورود...");

    try{

        const response =
            await fetch(
                API_BASE + "/api/login",
                {
                    method:"POST",
                    credentials:"include",
                    headers:{
                        "Content-Type":"application/json"
                    },
                    body:JSON.stringify({
                        email,
                        password
                    })
                }
            );

        const data =
            await response.json();

        if(!response.ok || data.success === false){

            showMessage(
                data.message ||
                "ایمیل یا رمز عبور اشتباه است."
            );

            return;
        }

        closeAuth();

        await checkLogin();

    }catch(error){

        console.error(error);

        showMessage(
            "ارتباط با سرور برقرار نشد."
        );
    }
}


/* =========================
   CHECK LOGIN
========================= */

async function checkLogin(){

    try{

        const response =
            await fetch(
                API_BASE + "/api/me",
                {
                    method:"GET",
                    credentials:"include"
                }
            );

        if(!response.ok){

            setLoggedOut();
            return;
        }

        const data =
            await response.json();

        if(data.success && data.user){

            setLoggedIn(data.user);
        }else{

            setLoggedOut();
        }

    }catch(error){

        console.error(error);

        setLoggedOut();
    }
}


function setLoggedIn(user){

    document
        .getElementById("loginButton")
        .style.display = "none";

    document
        .getElementById("userBox")
        .style.display = "flex";

    document
        .getElementById("userName")
        .textContent =
        user.name ||
        user.email ||
        "کاربر";
}


function setLoggedOut(){

    document
        .getElementById("loginButton")
        .style.display = "block";

    document
        .getElementById("userBox")
        .style.display = "none";
}


/* =========================
   LOGOUT
========================= */

async function logout(){

    try{

        await fetch(
            API_BASE + "/api/logout",
            {
                method:"POST",
                credentials:"include"
            }
        );

    }catch(error){

        console.error(error);

    }

    setLoggedOut();
}
function openPanel(){
    window.location.href = "panel.html";
}


/* =========================
   CLOSE MODAL OUTSIDE
========================= */

document
    .getElementById("authModal")
    .addEventListener("click", function(event){

        if(event.target === this){
            closeAuth();
        }

    });


/* =========================
   START
========================= */

loadProducts();
checkLogin();

</script>

</body>
</html>
